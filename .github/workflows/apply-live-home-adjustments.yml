name: Apply live Home adjustments

on:
  push:
    branches:
      - feature/live-home-adjustments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Apply focused skin changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('skin.confluence.custom')
          settings_path = root / '1080p' / 'SkinSettings.xml'
          home_path = root / '1080p' / 'Home.xml'
          includes_path = root / '1080p' / 'Includes.xml'
          addon_path = root / 'addon.xml'

          def replace_once(text, old, new, label, allow_already=False):
              if old in text:
                  if text.count(old) != 1:
                      raise RuntimeError('{}: expected one source match'.format(label))
                  return text.replace(old, new, 1)
              if allow_already and new in text:
                  return text
              raise RuntimeError('{}: source match not found'.format(label))

          # Settings: move Vertical menu position into Home, immediately below
          # Shadow offset. Point both live-adjusted settings directly at the new
          # controller; the existing mainmenu_style.py remains untouched.
          settings = settings_path.read_text(encoding='utf-8')
          settings = replace_once(
              settings,
              'RunScript(special://skin/resources/lib/mainmenu_style.py,homecover)',
              'RunScript(special://skin/resources/lib/live_home_adjust.py,cover)',
              'cover live action',
              allow_already=True,
          )
          settings = replace_once(
              settings,
              'RunScript(special://skin/resources/lib/mainmenu_style.py,yoffset)',
              'RunScript(special://skin/resources/lib/live_home_adjust.py,yoffset)',
              'menu-position live action',
              allow_already=True,
          )

          vertical_re = re.compile(
              r'\n\s*<control type="button" id="522">.*?</control>', re.S
          )
          matches = list(vertical_re.finditer(settings))
          if len(matches) != 1:
              raise RuntimeError('Vertical menu position control count: {}'.format(len(matches)))
          match = matches[0]
          vertical_block = match.group(0).lstrip('\n')
          settings = settings[:match.start()] + settings[match.end():]

          shadow_re = re.compile(
              r'<control type="button" id="547">.*?</control>', re.S
          )
          shadow_matches = list(shadow_re.finditer(settings))
          if len(shadow_matches) != 1:
              raise RuntimeError('Shadow offset control count: {}'.format(len(shadow_matches)))
          shadow = shadow_matches[0]
          settings = settings[:shadow.end()] + '\n' + vertical_block + settings[shadow.end():]
          settings_path.write_text(settings, encoding='utf-8')

          home = home_path.read_text(encoding='utf-8')
          includes = includes_path.read_text(encoding='utf-8')

          apply_onload = (
              '\t<onload condition="Skin.HasSetting(CCHomeMusicCoverDynamic)">'
              'RunScript(special://skin/resources/lib/live_home_adjust.py,apply)</onload>\n'
          )
          if apply_onload not in home:
              startup_onload = '\t<onload>RunScript(special://skin/resources/lib/startup.py)</onload>\n'
              if startup_onload not in home:
                  raise RuntimeError('Home startup onload not found')
              home = home.replace(startup_onload, startup_onload + apply_onload, 1)

          # Existing installations keep their proven static cover-size controls.
          # Once the live selector is used, dynamic mode shows only the 195 px
          # base controls and resizes those at runtime to any positive size.
          if 'Skin.HasSetting(CCHomeMusicCoverDynamic)' not in includes:
              size_expr_re = re.compile(
                  r'String\.IsEqual\(Skin\.String\(CCHomeMusicCoverSize\),(\d+)\)'
              )

              def dynamic_conditions(text):
                  def repl(match):
                      if match.group(1) == '195':
                          return match.group(0)
                      return '[{} + !Skin.HasSetting(CCHomeMusicCoverDynamic)]'.format(
                          match.group(0)
                      )

                  text = size_expr_re.sub(repl, text)
                  base = (
                      'String.IsEmpty(Skin.String(CCHomeMusicCoverSize)) | '
                      'String.IsEqual(Skin.String(CCHomeMusicCoverSize),195)'
                  )
                  return text.replace(
                      base,
                      '[Skin.HasSetting(CCHomeMusicCoverDynamic) | {}]'.format(base),
                  )

              home = dynamic_conditions(home)
              includes = dynamic_conditions(includes)

              def add_image_id(text, description, control_id):
                  pattern = re.compile(
                      r'<control type="image"(?P<rest>\s*>\s*<description>'
                      + re.escape(description)
                      + r'</description>)'
                  )
                  found = list(pattern.finditer(text))
                  if len(found) != 1:
                      raise RuntimeError(
                          '{}: expected one base image, got {}'.format(description, len(found))
                      )
                  return pattern.sub(
                      '<control type="image" id="{}"\\g<rest>'.format(control_id),
                      text,
                      count=1,
                  )

              image_ids = [
                  ('Cover image 195px', 9301),
                  ('Borderless cover image 195px', 9302),
                  ('Selector single framed artwork 195px', 9303),
                  ('Selector single borderless artwork 195px', 9304),
                  ('Selector front framed pair 195px', 9305),
                  ('Selector back framed pair 195px', 9306),
                  ('Selector front borderless pair 195px', 9307),
                  ('Selector back borderless pair 195px', 9308),
              ]
              for description, control_id in image_ids:
                  home = add_image_id(home, description, control_id)

              for include_name, control_id in (
                  ('CCHomeMusicMainShadowOffsetGroups', 9310),
                  ('CCHomeMusicSelectorSingleShadowOffsetGroups', 9311),
                  ('CCHomeMusicSelectorPairShadowOffsetGroups', 9312),
              ):
                  old = '<include>{}</include>'.format(include_name)
                  new = (
                      '<control type="group" id="{}"><include>{}</include></control>'
                      .format(control_id, include_name)
                  )
                  if home.count(old) != 1:
                      raise RuntimeError('{} include count is not one'.format(include_name))
                  home = home.replace(old, new, 1)

              info_def_old = (
                  '<param name="visible" default="true"/>\n'
                  '\t\t<definition>\n'
                  '\t\t\t<control type="group">'
              )
              info_def_new = (
                  '<param name="visible" default="true"/>\n'
                  '\t\t<param name="id" default="0"/>\n'
                  '\t\t<definition>\n'
                  '\t\t\t<control type="group" id="$PARAM[id]">'
              )
              if includes.count(info_def_old) != 1:
                  raise RuntimeError('CCHomeMusicInfoText definition not found exactly once')
              includes = includes.replace(info_def_old, info_def_new, 1)

              info_instance_re = re.compile(
                  r'(<include content="CCHomeMusicInfoText">\s*'
                  r'<param name="left" value="255"\s*/>)'
              )
              info_matches = list(info_instance_re.finditer(home))
              if len(info_matches) != 1:
                  raise RuntimeError(
                      '195px music info instance count: {}'.format(len(info_matches))
                  )
              home = info_instance_re.sub(
                  r'\1\n\t\t\t\t<param name="id" value="9309"/>',
                  home,
                  count=1,
              )

          home_path.write_text(home, encoding='utf-8')
          includes_path.write_text(includes, encoding='utf-8')

          addon = addon_path.read_text(encoding='utf-8')
          if 'version="5.0.173"' in addon:
              addon = addon.replace('version="5.0.173"', 'version="5.0.174"', 1)
              addon = re.sub(
                  r'<news>.*?</news>',
                  '<news>5.0.174: Add live Home preview for vertical menu position and unrestricted 25 px cover-size adjustment.</news>',
                  addon,
                  count=1,
              )
          elif 'version="5.0.174"' not in addon:
              raise RuntimeError('Unexpected add-on version')
          addon_path.write_text(addon, encoding='utf-8')
          PY

      - name: Validate changes
        shell: bash
        run: |
          python -m py_compile skin.confluence.custom/resources/lib/live_home_adjust.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('skin.confluence.custom')
          for rel in ('1080p/SkinSettings.xml', '1080p/Home.xml', '1080p/Includes.xml', 'addon.xml'):
              ET.parse(root / rel)

          settings = (root / '1080p/SkinSettings.xml').read_text(encoding='utf-8')
          assert settings.count('id="522"') == 1
          p_home = settings.index('id="5750"')
          p_shadow = settings.index('id="547"', p_home)
          p_vertical = settings.index('id="522"', p_home)
          p_bottom = settings.index('id="520"', p_home)
          p_menus = settings.index('id="5730"')
          assert p_home < p_shadow < p_vertical < p_bottom < p_menus
          assert 'live_home_adjust.py,cover' in settings
          assert 'live_home_adjust.py,yoffset' in settings

          home = (root / '1080p/Home.xml').read_text(encoding='utf-8')
          for control_id in list(range(9301, 9309)) + list(range(9310, 9313)):
              assert home.count('id="{}"'.format(control_id)) == 1, control_id
          assert home.count('<param name="id" value="9309"/>') == 1
          assert 'live_home_adjust.py,apply' in home
          assert 'Skin.HasSetting(CCHomeMusicCoverDynamic)' in home

          includes = (root / '1080p/Includes.xml').read_text(encoding='utf-8')
          assert 'Skin.HasSetting(CCHomeMusicCoverDynamic)' in includes
          assert '<param name="id" default="0"/>' in includes
          assert 'id="$PARAM[id]"' in includes
          PY
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- skin.confluence.custom; then
            echo "Implementation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skin.confluence.custom/1080p/SkinSettings.xml \
                  skin.confluence.custom/1080p/Home.xml \
                  skin.confluence.custom/1080p/Includes.xml \
                  skin.confluence.custom/addon.xml
          git commit -m "Add live Home adjustment for menu position and cover size"
          git push origin HEAD:feature/live-home-adjustments
