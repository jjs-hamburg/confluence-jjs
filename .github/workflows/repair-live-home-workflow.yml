name: Repair live Home adjustment workflow

on:
  push:
    branches:
      - feature/live-home-adjustments

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Patch validation and startup retry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-live-home-adjustments.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''for control_id in range(9301, 9313):\n              assert home.count('id="{}"'.format(control_id)) == 1, control_id''',
                  '''for control_id in list(range(9301, 9309)) + list(range(9310, 9313)):\n              assert home.count('id="{}"'.format(control_id)) == 1, control_id\n          assert home.count('<param name="id" value="9309"/>') == 1''',
                  '9309 validation',
              ),
              (
                  '''window = xbmcgui.Window(HOME_WINDOW_ID)\n              size = max(1, int(size))''',
                  '''window = xbmcgui.Window(HOME_WINDOW_ID)\n              if _control(window, ID_MAIN_FRAME) is None:\n                  raise RuntimeError("Home controls not ready")\n              size = max(1, int(size))''',
                  'Home control readiness retry',
              ),
              (
                  '''_set_string(Y_OFFSET_SETTING, current if False else _skin_int(Y_OFFSET_SETTING, current))''',
                  '''_set_string(Y_OFFSET_SETTING, _skin_int(Y_OFFSET_SETTING, current))''',
                  'yoffset confirmation cleanup',
              ),
              (
                  '''rm .github/workflows/apply-live-home-adjustments.yml''',
                  '''rm .github/workflows/apply-live-home-adjustments.yml\n          rm -f .trigger-live-home-adjustments''',
                  'trigger cleanup',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit workflow repair
        shell: bash
        run: |
          rm .github/workflows/repair-live-home-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live Home adjustment validation"
          git push origin HEAD:feature/live-home-adjustments
