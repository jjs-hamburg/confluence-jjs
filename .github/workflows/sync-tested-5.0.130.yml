name: "Sync tested Confluence Custom 5.0.130"

on:
  push:
    branches:
      - main
    paths:
      - ".sync/skin-5.0.126-to-5.0.130.patch.gz"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=".sync/skin-5.0.126-to-5.0.130.patch.gz"
          test -f "$PATCH"
          gzip -dc "$PATCH" | git apply --index
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("skin.confluence.custom/addon.xml").getroot()
          assert root.attrib["id"] == "skin.confluence.custom"
          assert root.attrib["version"] == "5.0.130"
          print(root.attrib["id"], root.attrib["version"])
          PY
          rm -f "$PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import tested Confluence Custom 5.0.130"
          git push
