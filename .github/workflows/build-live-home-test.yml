name: Build 5.0.174 live Home test

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - .trigger-live-home-test-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/live-home-adjustments

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root_dir = Path('skin.confluence.custom')
          addon = ET.parse(root_dir / 'addon.xml').getroot()
          assert addon.attrib['id'] == 'skin.confluence.custom'
          assert addon.attrib['version'] == '5.0.174'

          for item in sorted((root_dir / 'resources' / 'lib').rglob('*.py')):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in [
              root_dir / '1080p',
              root_dir / 'resources' / 'skin_modes' / 'custom',
              root_dir / 'resources' / 'skin_modes' / 'standard',
          ]:
              for item in sorted(xml_dir.glob('*.xml')):
                  ET.parse(item)

          settings = (root_dir / '1080p' / 'SkinSettings.xml').read_text(encoding='utf-8')
          assert settings.count('id="522"') == 1
          assert settings.index('id="547"') < settings.index('id="522"') < settings.index('id="520"')

          includes = (root_dir / '1080p' / 'Includes.xml').read_text(encoding='utf-8')
          assert 'String.IsEqual(Skin.String(CCHomeMusicCoverSize),195) | [!Skin.HasSetting(CCHomeMusicCoverDynamic) + String.IsEmpty(Skin.String(CCHomeMusicCoverSize))]' in includes
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='skin.confluence.custom-5.0.174-test.zip'
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr "$ZIP" skin.confluence.custom -x '*/__pycache__/*' '*.pyc'
          python - "$ZIP" <<'PY'
          import sys, zipfile
          p = sys.argv[1]
          with zipfile.ZipFile(p) as zf:
              assert zf.testzip() is None
              assert 'skin.confluence.custom/addon.xml' in zf.namelist()
          print('ZIP OK:', p)
          PY
          sha256sum "$ZIP"

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: confluence-jjs-5.0.174-test
          path: skin.confluence.custom-5.0.174-test.zip
          if-no-files-found: error