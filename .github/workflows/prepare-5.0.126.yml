name: "Prepare JJS KODI Confluence Custom 5.0.126"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-5.0.126.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare and validate 5.0.126
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/prepare_5_0_126.py
          git diff --check

      - name: Commit release source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/prepare_5_0_126.py
          rm -f .github/workflows/prepare-5.0.126.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Release JJS KODI Confluence Custom 5.0.126"
          git push

      - name: Start direct release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-skin.yml --ref main
