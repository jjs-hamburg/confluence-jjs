name: "Temporary 5.0.179 pair shadow patch"

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - "tools/patch_5_0_179_pair_shadow.py"
      - ".github/workflows/temp-5-0-179-pair-shadow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Apply 5.0.179 patch
        run: python tools/patch_5_0_179_pair_shadow.py

      - name: Validate patched skin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import struct
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = (root / "addon.xml").read_text(encoding="utf-8")
          assert 'version="5.0.179"' in addon

          for p in sorted((root / "resources/lib").rglob("*.py")):
              py_compile.compile(str(p), doraise=True)
          for d in (root / "1080p", root / "resources/skin_modes/custom", root / "resources/skin_modes/standard"):
              for p in sorted(d.glob("*.xml")):
                  ET.parse(p)

          assert (root / "1080p/Home.xml").read_bytes() == (root / "resources/skin_modes/custom/Home.xml").read_bytes()
          assert (root / "1080p/SkinSettings.xml").read_bytes() == (root / "resources/skin_modes/custom/SkinSettings.xml").read_bytes()
          assert (root / "1080p/Includes.xml").read_bytes() == (root / "resources/skin_modes/custom/Includes.xml").read_bytes()

          home = (root / "1080p/Home.xml").read_text(encoding="utf-8")
          for cid in (9440,9441,9442,9450,9451,9452,9460,9461,9462,9470,9471,9472):
              assert f'id="{cid}"' in home, cid

          live = (root / "resources/lib/live_home_adjust.py").read_text(encoding="utf-8")
          assert "DYNAMIC_PAIR_SHADOW_CONTROLS" in live
          assert "def _pair_shadow_rects" in live
          start = live.index("def _pair_shadow_rects")
          end = live.index("\ndef _apply_dynamic_shadow_once", start)
          ns = {}
          exec(live[start:end], ns)
          f = ns["_pair_shadow_rects"]
          assert f(745,202,195,0,0) == (None,None,None)
          assert f(745,202,195,15,0) == ((940,202,15,195),(745,397,195,15),(940,397,15,15))
          assert f(745,202,195,0,15) == ((940,217,15,180),(760,397,180,15),(940,397,15,15))

          def png_size(path):
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              return struct.unpack('>II', data[16:24])
          assert png_size(root / "media/CCCoverShadowDynamicSoftRight.png") == (24,1)
          assert png_size(root / "media/CCCoverShadowDynamicSoftBottom.png") == (1,24)
          print("5.0.179 validation OK")
          PY

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch_5_0_179_pair_shadow.py .github/workflows/temp-5-0-179-pair-shadow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5.0.179: fix front back pair shadow masking"
          git push origin HEAD:feature/live-home-adjustments

      - name: Build direct-install test ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/skin.confluence.custom-5.0.179-test.zip skin.confluence.custom
          unzip -t /tmp/skin.confluence.custom-5.0.179-test.zip >/dev/null
          sha256sum /tmp/skin.confluence.custom-5.0.179-test.zip

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.179-test
          path: /tmp/skin.confluence.custom-5.0.179-test.zip
          if-no-files-found: error
          retention-days: 7
