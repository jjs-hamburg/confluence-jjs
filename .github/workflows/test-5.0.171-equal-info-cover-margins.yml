name: "Build 5.0.171 equal info-cover margins"

on:
  push:
    branches:
      - test-5.0.171-equal-info-cover-margins

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.attrib["version"] == "5.0.171"
          assert any(e.attrib.get("point") == "xbmc.gui.skin" for e in addon.findall("extension"))
          assert not any(e.attrib.get("point") == "xbmc.service" for e in addon.findall("extension"))

          active = (root / "1080p" / "Home.xml").read_text(encoding="utf-8")
          custom = (root / "resources" / "skin_modes" / "custom" / "Home.xml").read_text(encoding="utf-8")
          assert active == custom

          # New views still exist in the same cycle, but their horizontal geometry
          # now comes from actual rendered artwork widths.
          assert "5.0.171: two large artwork modes" in active
          assert "ConfluenceCustom.NowPlaying.InfoBackShiftThousands" in active
          assert "ConfluenceCustom.NowPlaying.InfoTextShiftThousands" in active
          assert "Info-side large front 302px" in active
          assert "<width>900</width><height>302</height>" in active
          assert "end=\"1000,0\"" in active
          assert "end=\"900,0\"" in active
          assert "end=\"9,0\"" in active

          cover = (root / "resources" / "lib" / "cover_display_action.py").read_text(encoding="utf-8")
          assert "INFO_MARGIN = 10" in cover
          assert "def sync_info_cover_geometry(mode=None):" in cover
          assert "single_shift = max(0, front_width - INFO_MARGIN)" in cover
          assert "pair_shift = max(0, front_width + back_width)" in cover
          assert "back_shift = max(0, front_width + INFO_MARGIN)" in cover
          assert "Skin.SetString({},{})" in cover

          service = (root / "resources" / "lib" / "songselector_service.py").read_text(encoding="utf-8")
          assert "sync_info_cover_geometry()" in service
          assert "INFO_TEXT_SHIFT_PROP" in service
          assert "width - _info_artwork_text_shift(home)" in service

          # Persistence logic is intentionally unchanged: no new reset/default path.
          mainmenu = (root / "resources" / "lib" / "mainmenu_style.py").read_text(encoding="utf-8")
          assert 'DEFAULT_HOME_ARTWORK_MODE = "front"' in mainmenu

          # Keep previously proven popup and progress fixes.
          popup = (root / "resources" / "lib" / "songselector_action.py").read_text(encoding="utf-8")
          assert "if target != previous_playing:" not in popup
          progress = (root / "1080p" / "DialogExtendedProgressBar.xml").read_text(encoding="utf-8")
          assert "CCProgressPathStandard" in progress
          assert "<haspath>true</haspath>" in progress

          for item in sorted((root / "resources" / "lib").rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in (
              root / "1080p",
              root / "resources" / "skin_modes" / "custom",
              root / "resources" / "skin_modes" / "standard",
          ):
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr skin.confluence.custom-5.0.171-test-equal-info-cover-margins.zip skin.confluence.custom
          python - <<'PY'
          import zipfile
          path = "skin.confluence.custom-5.0.171-test-equal-info-cover-margins.zip"
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              assert {n.split("/",1)[0] for n in zf.namelist() if n} == {"skin.confluence.custom"}
              assert "skin.confluence.custom/addon.xml" in zf.namelist()
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.171-test-equal-info-cover-margins
          path: skin.confluence.custom-5.0.171-test-equal-info-cover-margins.zip
          if-no-files-found: error
