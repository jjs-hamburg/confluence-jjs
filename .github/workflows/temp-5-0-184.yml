name: Temporary 5.0.184 resize fix

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - .github/workflows/temp-5-0-184.yml

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 5.0.184 resize patch
        run: python tools/temp_patch_5_0_184.py

      - name: Validate 5.0.184
        run: |
          python -m py_compile skin.confluence.custom/resources/lib/cover_display_action.py
          python -m py_compile skin.confluence.custom/resources/lib/live_home_adjust.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('skin.confluence.custom')
          addon = (root/'addon.xml').read_text()
          cover = (root/'resources/lib/cover_display_action.py').read_text()
          live = (root/'resources/lib/live_home_adjust.py').read_text()
          assert 'version="5.0.184"' in addon
          assert 'CENTER_COVER_SIZE_MIN = 300' in cover
          assert 'INFO_COVER_SIZE_MIN = 115' in cover
          assert 'RESIZE_LOCK_NAME = "music-view-resize"' in cover
          assert 'CENTER_COVER_RUNTIME_PROP' in cover
          assert 'INFO_COVER_RUNTIME_PROP' in cover
          assert 'height = min(natural_height, requested)' not in cover
          assert '_info_cover_max_height' in cover
          assert 'COVER_MIN = 300' in live
          assert 'size = max(COVER_MIN, int(size))' in live
          assert cover.count('def sync_info_cover_geometry(') == 1
          assert cover.count('def _resize_cover(direction):') == 1
          ET.parse(root/'addon.xml')
          ET.parse(root/'1080p/Home.xml')
          assert (root/'1080p/Home.xml').read_bytes() == (root/'resources/skin_modes/custom/Home.xml').read_bytes()
          assert (root/'1080p/Includes.xml').read_bytes() == (root/'resources/skin_modes/custom/Includes.xml').read_bytes()
          assert (root/'1080p/SkinSettings.xml').read_bytes() == (root/'resources/skin_modes/custom/SkinSettings.xml').read_bytes()
          PY

      - name: Verify only intended skin files changed from 5.0.183
        run: |
          BASE=a9d9c5a72a5a1a89f12ac5d71d8b2b0f7d87db6e
          git diff --name-only "$BASE" -- skin.confluence.custom | sort > /tmp/changed.txt
          printf '%s\n' skin.confluence.custom/addon.xml skin.confluence.custom/resources/lib/cover_display_action.py skin.confluence.custom/resources/lib/live_home_adjust.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit final 5.0.184 branch state
        run: |
          git config user.name "jjs-hamburg"
          git config user.email "jjschaefer@jjschaefer.de"
          git rm .github/workflows/temp-5-0-184.yml tools/temp_patch_5_0_184.py
          git add skin.confluence.custom/addon.xml skin.confluence.custom/resources/lib/cover_display_action.py skin.confluence.custom/resources/lib/live_home_adjust.py
          git commit -m "5.0.184: stabilize live cover resizing and expand info sizing"
          git push origin HEAD:feature/live-home-adjustments

      - name: Package test ZIP
        run: |
          zip -qr skin.confluence.custom-5.0.184-test.zip skin.confluence.custom
          unzip -t skin.confluence.custom-5.0.184-test.zip >/dev/null
          sha256sum skin.confluence.custom-5.0.184-test.zip

      - uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.184-test
          path: skin.confluence.custom-5.0.184-test.zip
          if-no-files-found: error
