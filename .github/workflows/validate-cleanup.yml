name: "Validate Confluence-jjs cleanup"

on:
  push:
    branches:
      - cleanup/5.0.190-runtime-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skin
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root_dir = Path("skin.confluence.custom")
          lib_dir = root_dir / "resources" / "lib"
          addon_xml = root_dir / "addon.xml"
          root = ET.parse(addon_xml).getroot()

          addon_id = root.attrib["id"]
          version = root.attrib["version"]
          name = root.attrib["name"]

          assert addon_id == "skin.confluence.custom", addon_id
          assert name == "Confluence-jjs", name
          assert version == "5.0.190", version
          assert any(
              e.attrib.get("point") == "xbmc.gui.skin"
              for e in root.findall("extension")
          ), "Missing xbmc.gui.skin extension"

          required = [
              root_dir / "1080p" / "Home.xml",
              root_dir / "1080p" / "Includes.xml",
              root_dir / "1080p" / "SkinSettings.xml",
              root_dir / "resources" / "skin_modes" / "custom" / "Home.xml",
              root_dir / "resources" / "skin_modes" / "custom" / "Includes.xml",
              root_dir / "resources" / "skin_modes" / "custom" / "SkinSettings.xml",
              root_dir / "resources" / "skin_modes" / "standard" / "Home.xml",
              lib_dir / "home_geometry_action.py",
              lib_dir / "nowplaying_service.py",
              lib_dir / "songpopup_controller.py",
              lib_dir / "songpopup_data.py",
              lib_dir / "songpopup_focus_action.py",
              lib_dir / "songpopup_service.py",
              lib_dir / "songselector_service.py",
              lib_dir / "songselector_action.py",
              lib_dir / "culrc_runner.py",
              lib_dir / "credits_resolver.py",
              lib_dir / "credits_runtime.py",
              lib_dir / "menu_editor.py",
              lib_dir / "skin_mode.py",
              root_dir / "resources" / "factory-default-settings.json",
              root_dir / "LICENSE.txt",
          ]
          for item in required:
              assert item.is_file() and item.stat().st_size > 0, f"Missing/empty: {item}"

          assert (root_dir / "1080p" / "SkinSettings.xml").read_bytes() == (
              root_dir / "resources" / "skin_modes" / "custom" / "SkinSettings.xml"
          ).read_bytes(), "Active/custom SkinSettings.xml differ"

          assert (root_dir / "1080p" / "Includes.xml").read_bytes() == (
              root_dir / "resources" / "skin_modes" / "custom" / "Includes.xml"
          ).read_bytes(), "Active/custom Includes.xml differ"

          # Architecture guardrails for the 5.0.190 runtime cleanup. Persistent
          # workers may publish properties and observe Kodi state, but direct
          # Control mutation belongs in short-lived UI action scripts only.
          nowplaying = (lib_dir / "nowplaying_service.py").read_text(encoding="utf-8")
          popup = (lib_dir / "songpopup_service.py").read_text(encoding="utf-8")
          popup_data = (lib_dir / "songpopup_data.py").read_text(encoding="utf-8")
          popup_action = (lib_dir / "songselector_action.py").read_text(encoding="utf-8")
          popup_controller = (lib_dir / "songpopup_controller.py").read_text(encoding="utf-8")
          startup = (lib_dir / "startup.py").read_text(encoding="utf-8")

          assert "getControl(" not in nowplaying, "Now Playing worker must not access GUI controls"
          assert "sync_info_cover_geometry" not in nowplaying, "Now Playing worker must dispatch geometry actions"
          assert "getControl(" not in popup, "Song Popup worker must not access GUI controls"
          assert "Dialog.Close(" not in popup, "Song Popup worker must close only through controller"
          assert "Dialog.Close(" not in popup_action, "Song actions must close only through controller"
          assert "Dialog.Close(" in popup_controller, "Song Popup controller must own window close"
          assert "GoToPending" not in popup + popup_action + popup_controller, "Legacy GoTo inference must stay removed"
          assert "culrc_runner.py" not in startup, "Popup-only lyrics worker must not start with the skin"
          assert "culrc_runner.py" in popup_controller, "Popup controller must start the lyrics session"

          # 5.0.190 regressions: explicit song selection must not start a redundant
          # focus action, explicit Stop must not wait for the natural-end settle
          # window, and lyrics must normalize common UTF-8 mojibake before layout.
          assert "PLAYBACK_STOP_SETTLE_SECONDS" not in popup, "Legacy combined Stop/End delay returned"
          assert "PLAYBACK_END_SETTLE_SECONDS = 1.0" in popup, "Natural-end protection missing"
          assert "self.stop_now = True" in popup, "Explicit Stop is not immediate"
          assert "if self._selection_transition():" in popup, "Player.GoTo Stop suppression missing"
          assert "if home.getProperty(SELECTION_TARGET_PROP):" in popup, "Explicit-selection focus suppression missing"
          assert "repair_mojibake(raw or \"\")" in popup_data, "Lyrics mojibake normalization missing"

          for item in sorted(lib_dir.rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in [
              root_dir / "1080p",
              root_dir / "resources" / "skin_modes" / "custom",
              root_dir / "resources" / "skin_modes" / "standard",
          ]:
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)

          Path("skin-version.txt").write_text(version, encoding="utf-8")
          print(f"{addon_id} {version} {name}")
          PY

      - name: Build test ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat skin-version.txt)"
          ZIP="skin.confluence.custom-${VERSION}.zip"

          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete

          zip -qr "$ZIP" skin.confluence.custom -x "*/__pycache__/*" "*.pyc"

          python - "$ZIP" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]
          with zipfile.ZipFile(zip_path) as zf:
              names = zf.namelist()
              roots = {name.split("/", 1)[0] for name in names if name}
              assert roots == {"skin.confluence.custom"}, roots
              assert "skin.confluence.custom/addon.xml" in names
              assert zf.testzip() is None
          print("ZIP structure OK:", zip_path)
          PY

          echo "SKIN_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: confluence-jjs-5.0.190-runtime-cleanup-test
          path: ${{ env.SKIN_ZIP }}
          if-no-files-found: error
