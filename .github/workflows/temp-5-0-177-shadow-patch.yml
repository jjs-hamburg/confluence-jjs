name: "Temporary 5.0.177 shadow patch"

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - "tools/patch_5_0_177_shadow.py"
      - ".github/workflows/temp-5-0-177-shadow-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Apply 5.0.177 patch
        run: python tools/patch_5_0_177_shadow.py

      - name: Validate patched skin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          assert 'version="5.0.177"' in (root / "addon.xml").read_text(encoding="utf-8")
          assert not (root / "resources/lib/shadow_refresh_service.py").exists()
          assert "shadow_refresh_service.py" not in (root / "addon.xml").read_text(encoding="utf-8")

          for p in sorted((root / "resources/lib").rglob("*.py")):
              py_compile.compile(str(p), doraise=True)
          for d in (root / "1080p", root / "resources/skin_modes/custom", root / "resources/skin_modes/standard"):
              for p in sorted(d.glob("*.xml")):
                  ET.parse(p)

          assert (root / "1080p/Home.xml").read_bytes() == (root / "resources/skin_modes/custom/Home.xml").read_bytes()
          assert (root / "1080p/SkinSettings.xml").read_bytes() == (root / "resources/skin_modes/custom/SkinSettings.xml").read_bytes()
          assert (root / "1080p/Includes.xml").read_bytes() == (root / "resources/skin_modes/custom/Includes.xml").read_bytes()

          home = (root / "1080p/Home.xml").read_text(encoding="utf-8")
          settings = (root / "1080p/SkinSettings.xml").read_text(encoding="utf-8")
          for cid in list(range(9400,9409)) + list(range(9410,9419)) + list(range(9420,9429)) + list(range(9430,9439)) + list(range(9440,9449)) + list(range(9450,9459)) + list(range(9460,9469)) + list(range(9470,9479)):
              assert 'id="{}"'.format(cid) in home, cid
          assert settings.count("live_home_adjust.py,shadow") == 1
          assert "mainmenu_style.py,homeshadowwidth" not in settings
          assert "mainmenu_style.py,homeshadowoffset" not in settings
          for style in ("Hard", "Soft"):
              for width in (6,10,14,18,22,26,30,34,38):
                  assert (root / "media" / "CCCoverShadowFrame{}{:02d}.png".format(style, width)).is_file()
          print("5.0.177 validation OK")
          PY

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch_5_0_177_shadow.py .github/workflows/temp-5-0-177-shadow-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5.0.177: live absolute shadow adjustment"
          git push origin HEAD:feature/live-home-adjustments

      - name: Build direct-install test ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/skin.confluence.custom-5.0.177-test.zip skin.confluence.custom
          unzip -t /tmp/skin.confluence.custom-5.0.177-test.zip >/dev/null
          sha256sum /tmp/skin.confluence.custom-5.0.177-test.zip

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.177-test
          path: /tmp/skin.confluence.custom-5.0.177-test.zip
          if-no-files-found: error
          retention-days: 7
