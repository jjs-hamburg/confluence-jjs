name: Temporary 5.0.183 layout analysis

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - .github/workflows/temp-analyze-5-0-183.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dynamic music info controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path=Path('skin.confluence.custom/1080p/Home.xml')
          root=ET.parse(path).getroot()
          parent={c:p for p in root.iter() for c in p}
          def txt(e,tag):
              c=e.find(tag)
              return (c.text or '').strip() if c is not None and c.text else ''

          footer=None
          for c in root.iter('control'):
              if c.attrib.get('id')=='9099': footer=c; break
          assert footer is not None
          print('footer',footer.attrib,'left',txt(footer,'left'),'width',txt(footer,'width'))

          # Locate the innermost group whose direct animation carries the thousands shift.
          shift_group=None
          for g in footer.iter('control'):
              if g.attrib.get('type')!='group': continue
              if any(ch.tag=='animation' and 'InfoTextShiftThousands' in (ch.attrib.get('condition') or '') for ch in list(g)):
                  shift_group=g; break
          assert shift_group is not None
          print('shift_group',shift_group.attrib)

          wide=[]
          for c in shift_group.iter('control'):
              if txt(c,'width')=='1830':
                  wide.append(c)
          print('WIDTH1830_COUNT',len(wide))
          for i,c in enumerate(wide,1):
              print('WIDE',i,'type',c.attrib.get('type'),'id',c.attrib.get('id',''),'top',txt(c,'top'),'label',txt(c,'label')[:120],'visible',txt(c,'visible')[:140])

          # Print nearest group visibilities for the first static infofront and infoboth images.
          for prefix in ('Info-side large front ','Info-side large pair front ','Info-side large pair back '):
              target=None
              for c in footer.iter('control'):
                  if txt(c,'description').startswith(prefix): target=c; break
              print('\nTARGET',prefix,'found',bool(target))
              cur=target
              depth=0
              while cur is not None and cur is not footer:
                  if cur.tag=='control' and cur.attrib.get('type')=='group':
                      print(' GROUP',depth,cur.attrib,'visible=',txt(cur,'visible'))
                  cur=parent.get(cur); depth+=1
          PY
