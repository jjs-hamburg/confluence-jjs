name: "Build 5.0.170 info cover views test ZIP"

on:
  push:
    branches:
      - test-5.0.170-info-cover-views

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.attrib["version"] == "5.0.170"
          assert any(e.attrib.get("point") == "xbmc.gui.skin" for e in addon.findall("extension"))
          assert not any(e.attrib.get("point") == "xbmc.service" for e in addon.findall("extension"))

          active_home = (root / "1080p" / "Home.xml").read_text(encoding="utf-8")
          custom_home = (root / "resources" / "skin_modes" / "custom" / "Home.xml").read_text(encoding="utf-8")
          assert active_home == custom_home
          assert "Info-side large front 302px" in active_home
          assert '<description>Info-side large pair back 302px</description><left>292</left><top>-187</top><width>302</width><height>302</height>' in active_home
          assert 'end="292,0"' in active_home
          assert 'end="604,0"' in active_home
          assert active_home.count("!String.IsEqual(Skin.String(CCMusicArtworkMode),infofront)") == 3
          assert active_home.count("!String.IsEqual(Skin.String(CCMusicArtworkMode),infoboth)") == 3

          action = (root / "resources" / "lib" / "cover_display_action.py").read_text(encoding="utf-8")
          assert 'elif mode == "both":\n        new_mode = "infofront"' in action
          assert 'elif mode == "infofront":\n        new_mode = "infoboth" if has_back else "compact"' in action
          assert 'elif mode == "infoboth":\n        new_mode = "compact"' in action

          service = (root / "resources" / "lib" / "songselector_service.py").read_text(encoding="utf-8")
          assert "def _info_artwork_cover_size():" in service
          assert "def _info_artwork_text_shift(home, mode):" in service
          assert 'mode in ("infofront", "infoboth")' in service

          # Keep the already-tested same-track popup fix.
          popup_action = (root / "resources" / "lib" / "songselector_action.py").read_text(encoding="utf-8")
          assert "if target != previous_playing:" not in popup_action
          assert 'home.setProperty(SELECTION_TARGET_PROP, str(target))' in popup_action
          assert 'home.setProperty(SELECTION_GOTO_PENDING_PROP' in popup_action

          # Keep the already-tested 5.0.169 progress display modes.
          progress = (root / "1080p" / "DialogExtendedProgressBar.xml").read_text(encoding="utf-8")
          assert "$INFO[Control.GetLabel(31)]" in progress
          assert "<haspath>true</haspath>" in progress
          assert "CCProgressPathStandard" in progress

          for item in sorted((root / "resources" / "lib").rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in [
              root / "1080p",
              root / "resources" / "skin_modes" / "custom",
              root / "resources" / "skin_modes" / "standard",
          ]:
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr skin.confluence.custom-5.0.170-test-info-cover-views.zip skin.confluence.custom
          python - <<'PY'
          import zipfile
          path = "skin.confluence.custom-5.0.170-test-info-cover-views.zip"
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              assert {n.split("/",1)[0] for n in zf.namelist() if n} == {"skin.confluence.custom"}
              assert "skin.confluence.custom/addon.xml" in zf.namelist()
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.170-test-info-cover-views
          path: skin.confluence.custom-5.0.170-test-info-cover-views.zip
          if-no-files-found: error
