name: "Build 5.0.169 progress display test ZIP"

on:
  push:
    branches:
      - test-5.0.169-progress-display-mode

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.attrib["version"] == "5.0.169"
          assert any(e.attrib.get("point") == "xbmc.gui.skin" for e in addon.findall("extension"))
          assert not any(e.attrib.get("point") == "xbmc.service" for e in addon.findall("extension"))

          progress_path = root / "1080p" / "DialogExtendedProgressBar.xml"
          progress = ET.parse(progress_path).getroot()
          id31 = [c for c in progress.iter("control") if c.attrib.get("id") == "31"]
          assert len(id31) == 1
          assert (id31[0].findtext("visible") or "").strip().lower() == "false"
          labels = [c for c in progress.iter("control") if c.attrib.get("type") == "label"]
          optimized = [c for c in labels if (c.findtext("visible") or "").strip() == "!Skin.HasSetting(CCProgressPathStandard)"]
          standard = [c for c in labels if (c.findtext("visible") or "").strip() == "Skin.HasSetting(CCProgressPathStandard)"]
          assert len(optimized) == 1 and len(standard) == 1
          assert (optimized[0].findtext("label") or "").strip() == "$INFO[Control.GetLabel(31)]"
          assert (optimized[0].findtext("haspath") or "").strip().lower() == "true"
          assert (standard[0].findtext("label") or "").strip() == "$INFO[Control.GetLabel(31)]"
          assert standard[0].find("haspath") is None

          active = (root / "1080p" / "SkinSettings.xml").read_text(encoding="utf-8")
          custom = (root / "resources" / "skin_modes" / "custom" / "SkinSettings.xml").read_text(encoding="utf-8")
          standard_settings = (root / "resources" / "skin_modes" / "standard" / "SkinSettings.xml").read_text(encoding="utf-8")
          assert active == custom
          for txt in (active, standard_settings):
              assert "Path optimized" in txt
              assert "Kodi standard" in txt
              assert "CCProgressPathStandard" in txt

          action = (root / "resources" / "lib" / "songselector_action.py").read_text(encoding="utf-8")
          assert "if target != previous_playing:" not in action
          assert 'home.setProperty(SELECTION_TARGET_PROP, str(target))' in action
          assert 'home.setProperty(SELECTION_GOTO_PENDING_PROP' in action

          for item in sorted((root / "resources" / "lib").rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in [
              root / "1080p",
              root / "resources" / "skin_modes" / "custom",
              root / "resources" / "skin_modes" / "standard",
          ]:
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr skin.confluence.custom-5.0.169-test-progress-display.zip skin.confluence.custom
          python - <<'PY'
          import zipfile
          path = "skin.confluence.custom-5.0.169-test-progress-display.zip"
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              assert {n.split("/",1)[0] for n in zf.namelist() if n} == {"skin.confluence.custom"}
              assert "skin.confluence.custom/addon.xml" in zf.namelist()
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.169-test-progress-display
          path: skin.confluence.custom-5.0.169-test-progress-display.zip
          if-no-files-found: error
