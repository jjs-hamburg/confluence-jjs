name: "Build 5.0.172 cover layout guide"

on:
  push:
    branches:
      - test-5.0.172-cover-layout-guide

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.attrib["version"] == "5.0.172"
          assert any(e.attrib.get("point") == "xbmc.gui.skin" for e in addon.findall("extension"))
          assert not any(e.attrib.get("point") == "xbmc.service" for e in addon.findall("extension"))

          active_home = (root / "1080p" / "Home.xml").read_text(encoding="utf-8")
          custom_home = (root / "resources" / "skin_modes" / "custom" / "Home.xml").read_text(encoding="utf-8")
          assert active_home == custom_home

          active_settings = (root / "1080p" / "SkinSettings.xml").read_text(encoding="utf-8")
          custom_settings = (root / "resources" / "skin_modes" / "custom" / "SkinSettings.xml").read_text(encoding="utf-8")
          assert active_settings == custom_settings
          assert "Music display above the menu bar" in active_settings
          assert "Skin.ToggleSetting(CCHomeMusicDisplayAboveMenu)" in active_settings

          # Whole display moves only for modes 3-6; centered front/both are absent
          # from the move-mode expression. Default menu position ends 10 px above
          # the menu via a -464 px group shift.
          assert 'end="0,-464"' in active_home
          move_lines = [line for line in active_home.splitlines()
                        if "CCHomeMusicDisplayAboveMenu" in line and '<animation effect="slide"' in line]
          assert len(move_lines) == 23
          for line in move_lines:
              assert "infofront" in line and "infoboth" in line and "compact" in line and "none" in line
              assert "CCMusicArtworkMode),front)" not in line
              assert "CCMusicArtworkMode),both)" not in line

          # Persistent cover-focus orientation help.
          assert "persistent orientation help" in active_home
          assert "<visible>Control.HasFocus(9150)</visible>" in active_home
          assert "<label>Cover view</label>" in active_home
          assert "<label>Enter: Change   ·   Down: Leave</label>" in active_home

          # Artwork boxes and Python geometry allow front/back widths to differ,
          # including wider-than-tall artwork.
          cover = (root / "resources" / "lib" / "cover_display_action.py").read_text(encoding="utf-8")
          assert "INFO_MAX_IMAGE_WIDTH = 1800" in cover
          assert "front_width = _info_art_width(front_art, height)" in cover
          assert "back_width = _info_art_width(back_art, height) if back_art else 0" in cover
          assert "min(int(height), width" not in cover
          assert "back_shift = max(0, front_width + INFO_MARGIN)" in cover
          assert "pair_shift = max(0, front_width + back_width)" in cover

          art_start = active_home.index("<!-- 5.0.171: two large artwork modes")
          art_end = active_home.index("<!-- 5.0.126: compact artwork", art_start)
          art_block = active_home[art_start:art_end]
          assert "<width>900</width>" not in art_block
          assert art_block.count("<width>1800</width>") >= 20

          # Home reset includes the new option; no startup/default change is introduced.
          mainmenu = (root / "resources" / "lib" / "mainmenu_style.py").read_text(encoding="utf-8")
          assert 'Skin.Reset(CCHomeMusicDisplayAboveMenu)' in mainmenu
          assert 'DEFAULT_HOME_ARTWORK_MODE = "front"' in mainmenu

          # Keep proven popup and 5.0.169 progress fixes.
          popup = (root / "resources" / "lib" / "songselector_action.py").read_text(encoding="utf-8")
          assert "if target != previous_playing:" not in popup
          progress = (root / "1080p" / "DialogExtendedProgressBar.xml").read_text(encoding="utf-8")
          assert "CCProgressPathStandard" in progress and "<haspath>true</haspath>" in progress

          for item in sorted((root / "resources" / "lib").rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in (
              root / "1080p",
              root / "resources" / "skin_modes" / "custom",
              root / "resources" / "skin_modes" / "standard",
          ):
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr skin.confluence.custom-5.0.172-test-cover-layout-guide.zip skin.confluence.custom
          python - <<'PY'
          import zipfile
          path = "skin.confluence.custom-5.0.172-test-cover-layout-guide.zip"
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              assert {n.split("/",1)[0] for n in zf.namelist() if n} == {"skin.confluence.custom"}
              assert "skin.confluence.custom/addon.xml" in zf.namelist()
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.172-test-cover-layout-guide
          path: skin.confluence.custom-5.0.172-test-cover-layout-guide.zip
          if-no-files-found: error
