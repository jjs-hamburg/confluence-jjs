name: Fix cover size label

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - .trigger-cover-size-label

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Fix dynamic cover size label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('skin.confluence.custom/1080p/Includes.xml')
          text = path.read_text(encoding='utf-8')
          old = '<value condition="[Skin.HasSetting(CCHomeMusicCoverDynamic) | String.IsEmpty(Skin.String(CCHomeMusicCoverSize)) | String.IsEqual(Skin.String(CCHomeMusicCoverSize),195)]">Original (195 px)</value>'
          new = '<value condition="String.IsEqual(Skin.String(CCHomeMusicCoverSize),195) | [!Skin.HasSetting(CCHomeMusicCoverDynamic) + String.IsEmpty(Skin.String(CCHomeMusicCoverSize))]">Original (195 px)</value>'
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one cover-size label condition')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          ET.parse(path)
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skin.confluence.custom/1080p/Includes.xml
          git commit -m "Fix dynamic cover size setting label"
          git push origin HEAD:feature/live-home-adjustments