name: "Build 5.0.173 margins badge exact wrap"

on:
  push:
    branches:
      - test-5.0.173-margins-badge

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import py_compile
          import sys
          import types
          import xml.etree.ElementTree as ET

          root = Path("skin.confluence.custom")
          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.attrib["version"] == "5.0.173"
          assert any(e.attrib.get("point") == "xbmc.gui.skin" for e in addon.findall("extension"))
          assert not any(e.attrib.get("point") == "xbmc.service" for e in addon.findall("extension"))

          active_home = (root / "1080p" / "Home.xml").read_text(encoding="utf-8")
          custom_home = (root / "resources" / "skin_modes" / "custom" / "Home.xml").read_text(encoding="utf-8")
          assert active_home == custom_home

          active_includes = (root / "1080p" / "Includes.xml").read_text(encoding="utf-8")
          custom_includes = (root / "resources" / "skin_modes" / "custom" / "Includes.xml").read_text(encoding="utf-8")
          assert active_includes == custom_includes

          active_settings = (root / "1080p" / "SkinSettings.xml").read_text(encoding="utf-8")
          custom_settings = (root / "resources" / "skin_modes" / "custom" / "SkinSettings.xml").read_text(encoding="utf-8")
          assert active_settings == custom_settings
          assert "Music display above the menu bar" in active_settings
          assert "Music view margin" in active_settings
          assert "homemusicviewmargin" in active_settings

          # Focus is now indicated by the badge only.
          assert "folder-focus.png" not in active_home
          assert active_home.count("Control.HasFocus(9150)") == 1
          assert "CCMusicViewChangeBadge" in active_home
          assert "<left>1410</left><top>263</top><width>470</width><height>74</height>" in active_home
          assert "Music View Change Mode" in active_includes
          assert "Enter: Change   ·   Down: Leave" in active_includes
          assert "CCTimeBadgeTexturePath" in active_includes
          assert "CCTimeBadge3D.png" in active_includes

          # One shared margin drives bottom and above-menu placement.
          assert "CCHomeMusicViewMargin" in active_home
          assert 'end="0,-480"' in active_home and "CCHomeMusicDisplayAboveMenu" in active_home
          assert 'end="0,-500"' in active_home  # margin 30, default menu position
          assert 'end="0,-20"' in active_home  # margin 30, bottom placement
          assert "Info-side large front 302px margin 10" in active_home
          assert "Info-side large front 262px margin 30" in active_home
          assert "Compact proportional cover focus" not in active_home
          assert "Info-side large front focus" not in active_home

          # Geometry is based on independent front/back widths and the same margin.
          cover = (root / "resources" / "lib" / "cover_display_action.py").read_text(encoding="utf-8")
          assert 'INFO_MARGIN_SETTING = "CCHomeMusicViewMargin"' in cover
          assert "front_width = _info_art_width(front_art, height)" in cover
          assert "back_width = _info_art_width(back_art, height) if back_art else 0" in cover
          assert "back_shift = max(0, front_width + margin)" in cover
          assert "pair_shift = max(0, front_width + back_width + (3 * margin) - 30)" in cover
          assert "INFO_DEFAULT_HEIGHT = 322" in cover

          mainmenu = (root / "resources" / "lib" / "mainmenu_style.py").read_text(encoding="utf-8")
          assert 'HOME_MUSIC_VIEW_MARGIN_SETTING = "CCHomeMusicViewMargin"' in mainmenu
          assert 'DEFAULT_HOME_MUSIC_VIEW_MARGIN = "10"' in mainmenu
          assert 'Skin.Reset(CCHomeMusicDisplayAboveMenu)' in mainmenu
          assert 'DEFAULT_HOME_ARTWORK_MODE = "front"' in mainmenu

          # Album/song footer wrapping uses the bundled TTF metrics, not the heuristic.
          service = (root / "resources" / "lib" / "songselector_service.py").read_text(encoding="utf-8")
          assert "truetype_metrics import text_width as truetype_text_width" in service
          album_block = service[service.index("def _split_album_wrap"):service.index("def _info_artwork_text_shift")]
          song_block = service[service.index("def _split_song_wrap"):service.index("def _update_song_wrap_properties")]
          assert "_footer_text_width" in album_block and "_estimated_text_width" not in album_block
          assert "_footer_text_width" in song_block and "_estimated_text_width" not in song_block
          assert r'\|\s+(\d{4})' in album_block
          assert '"|\u00a0"' in album_block

          # Exercise the dependency-free TrueType parser against the actual shipped fonts.
          sys.modules["xbmcvfs"] = types.SimpleNamespace(File=None)
          spec = importlib.util.spec_from_file_location(
              "ttm", root / "resources" / "lib" / "truetype_metrics.py"
          )
          ttm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ttm)
          regular = ttm.TrueTypeMetrics((root / "fonts" / "Roboto-Regular.ttf").read_bytes())
          bold = ttm.TrueTypeMetrics((root / "fonts" / "Roboto-Bold.ttf").read_bytes())
          for metrics, size, sample in (
              (regular, 26, "Gilles Peterson - Presents the BBC Sessions Volume 1: Music Takes Me Back - Serebrier | 2008"),
              (bold, 30, "A long song title with ffi and AV To"),
          ):
              width = metrics.width(sample, size)
              assert width > 100.0 and width < 5000.0
          assert regular.glyph_id(ord("S")) > 0
          assert regular.units_per_em > 0

          # Lyrics: exact title is searched first; only empty results trigger one cleaned retry.
          gui = (root / "resources" / "lib" / "culrc" / "gui.py").read_text(encoding="utf-8")
          exact = gui.index("lyrics = self.find_lyrics(song)")
          retry = gui.index("if not lyrics.lyrics and self.proceed()", exact)
          cleaned = gui.index("cleaned_title = re.sub", retry)
          second = gui.index("retry_lyrics = self.find_lyrics(retry_song)", cleaned)
          assert exact < retry < cleaned < second
          assert r"\s*\([^()]*\)\s*$" in gui
          assert "retry_lyrics.song = song" in gui

          # Proven popup/progress behavior stays present.
          popup = (root / "resources" / "lib" / "songselector_action.py").read_text(encoding="utf-8")
          assert "if target != previous_playing:" not in popup
          progress = (root / "1080p" / "DialogExtendedProgressBar.xml").read_text(encoding="utf-8")
          assert "CCProgressPathStandard" in progress and "<haspath>true</haspath>" in progress

          for item in sorted((root / "resources" / "lib").rglob("*.py")):
              py_compile.compile(str(item), doraise=True)

          for xml_dir in (
              root / "1080p",
              root / "resources" / "skin_modes" / "custom",
              root / "resources" / "skin_modes" / "standard",
          ):
              for item in sorted(xml_dir.glob("*.xml")):
                  ET.parse(item)
          PY

      - name: Build direct-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          find skin.confluence.custom -type d -name __pycache__ -prune -exec rm -rf {} +
          find skin.confluence.custom -type f -name '*.pyc' -delete
          zip -qr skin.confluence.custom-5.0.173-test-margins-badge.zip skin.confluence.custom
          python - <<'PY'
          import zipfile
          path = "skin.confluence.custom-5.0.173-test-margins-badge.zip"
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              assert {n.split("/",1)[0] for n in zf.namelist() if n} == {"skin.confluence.custom"}
              assert "skin.confluence.custom/addon.xml" in zf.namelist()
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.173-test-margins-badge
          path: skin.confluence.custom-5.0.173-test-margins-badge.zip
          if-no-files-found: error
