name: "Temporary 5.0.180 artwork shadow patch"

on:
  push:
    branches:
      - feature/live-home-adjustments
    paths:
      - "tools/patch_5_0_180_shadow.py"
      - ".github/workflows/temp-5-0-180-shadow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/live-home-adjustments
          fetch-depth: 0

      - name: Apply 5.0.180 patch
        run: python tools/patch_5_0_180_shadow.py

      - name: Validate 5.0.180
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import xml.etree.ElementTree as ET

          root = Path('skin.confluence.custom')
          addon = (root/'addon.xml').read_text(encoding='utf-8')
          home = (root/'1080p/Home.xml').read_text(encoding='utf-8')
          live = (root/'resources/lib/live_home_adjust.py').read_text(encoding='utf-8')

          assert 'version="5.0.180"' in addon
          py_compile.compile(str(root/'resources/lib/live_home_adjust.py'), doraise=True)
          for d in (root/'1080p', root/'resources/skin_modes/custom', root/'resources/skin_modes/standard'):
              for p in sorted(d.glob('*.xml')):
                  ET.parse(p)
          assert (root/'1080p/Home.xml').read_bytes() == (root/'resources/skin_modes/custom/Home.xml').read_bytes()
          assert (root/'1080p/Includes.xml').read_bytes() == (root/'resources/skin_modes/custom/Includes.xml').read_bytes()
          assert (root/'1080p/SkinSettings.xml').read_bytes() == (root/'resources/skin_modes/custom/SkinSettings.xml').read_bytes()

          expected = [9400,*range(9410,9418),9420,*range(9430,9438),9440,*range(9450,9458),9460,*range(9470,9478)]
          for cid in expected:
              assert f'id="{cid}"' in home, cid
          for old in (9441,9442,9461,9462):
              assert f'id="{old}"' not in home, old
          assert 'CCCoverShadowDynamicHard.png' not in home
          assert 'CCCoverShadowDynamicSoft.png' not in home
          assert 'SOFT_SHADOW_LAYERS = 8' in live
          assert 'extent = width + offset' in live
          assert 'if extent <= 0:' in live
          assert '_hide_shadow_control(hard)' in live
          assert '_pair_shadow_rects' not in live

          # Reference geometry: outer soft layer ends exactly at width+offset.
          def shifts(extent):
              if extent <= 0:
                  return ()
              count = min(8, extent)
              return tuple(((i+1)*extent + count - 1)//count for i in range(count))
          assert shifts(0) == ()
          assert shifts(1) == (1,)
          assert shifts(15)[-1] == 15
          assert shifts(25)[-1] == 25
          assert all(a < b for a,b in zip(shifts(15), shifts(15)[1:]))

          # Every dynamic shadow copy must use the same aspect model as the artwork.
          assert home.count('<aspectratio>keep</aspectratio><texture colordiffuse=') >= len(expected)
          print('5.0.180 validation OK')
          PY

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch_5_0_180_shadow.py .github/workflows/temp-5-0-180-shadow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5.0.180: make shadows follow rendered artwork"
          git push origin HEAD:feature/live-home-adjustments

      - name: Build direct-install test ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/skin.confluence.custom-5.0.180-test.zip skin.confluence.custom
          unzip -t /tmp/skin.confluence.custom-5.0.180-test.zip >/dev/null
          sha256sum /tmp/skin.confluence.custom-5.0.180-test.zip

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: skin.confluence.custom-5.0.180-test
          path: /tmp/skin.confluence.custom-5.0.180-test.zip
          if-no-files-found: error
          retention-days: 7
